[package]
name = "render"
version = "0.1.0"
edition = "2021"
description = "Surface-backed WebGPU drawing primitives for Burokku"
license = "MIT"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.11"
taffy = { version = "0.11", default-features = false }
thiserror = "2"
wgpu = "29"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
