[package]
name = "burokku-winit"
version = "0.1.0"
edition = "2021"
description = "A small native window and Tokio event-loop crate for Burokku"
license = "MIT"

[dependencies]
raw-window-handle = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
static_assertions = "1"
llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false, features = [
    "abort",
    "buffer",
    "console",
    "events",
    "exceptions",
    "fetch",
    "path",
    "stream-web",
    "timers",
    "tls-ring",
    "url",
] }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false }
runtime = { path = "../runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
