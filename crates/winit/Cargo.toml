[package]
name = "burokku-winit"
version = "0.1.0"
edition = "2021"
description = "A small native window and Tokio event-loop crate for Burokku"
license = "MIT"

[dependencies]
raw-window-handle = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
