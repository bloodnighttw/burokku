[package]
name = "burokku"
version = "0.1.0"
edition = "2021"
description = "Burokku JavaScript runtime application"
license = "MIT"

[dependencies]
render = { path = "../render" }
runtime = { path = "../runtime" }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
winit = "0.30"
