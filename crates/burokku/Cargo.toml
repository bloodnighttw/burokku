[package]
name = "burokku"
version = "0.1.0"
edition = "2021"
description = "Burokku JavaScript runtime application"
license = "MIT"

[dependencies]
arc-swap = "1"
png = "0.18"
runtime = { path = "../runtime" }
taffy = { version = "0.11", features = ["parse"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
vello = "0.9.0"
winit = { package = "burokku-winit", path = "../winit" }
