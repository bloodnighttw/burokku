[package]
name = "burokku"
version = "0.1.0"
edition = "2021"
description = "A builder-based native UI crate with pluggable dual JavaScript runtimes"
license = "MIT"

[dependencies]
arc-swap = "1"
runtime = { path = "../runtime" }
slotmap = "1"
taffy = { version = "0.11", default-features = false, features = [
    "std",
    "block_layout",
    "flexbox",
    "grid",
    "content_size",
    "parse",
] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
vello_common = { version = "0.2", default-features = false, features = ["std"] }
vello_hybrid = { version = "0.2", default-features = false, features = ["wgpu"] }
wgpu = { version = "29", features = ["std", "wgsl"] }
winit = { package = "burokku-winit", path = "../winit" }