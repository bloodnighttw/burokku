[package]
name = "burokku"
version = "0.1.0"
edition = "2021"
description = "A native UI crate with one thread-affine LLRT runtime and live DOM"
license = "MIT"

[features]
default = ["llrt-default"]
llrt-default = [
    "llrt-console",
    "llrt_modules/abort",
    "llrt_modules/buffer",
    "llrt_modules/events",
    "llrt_modules/exceptions",
    "llrt_modules/fetch",
    "llrt_modules/stream-web",
    "llrt_modules/tls-ring",
    "llrt_modules/url",
]
llrt-console = ["llrt_modules/console"]

[dependencies]
glifo = { version = "0.3.0", default-features = false, features = ["std"] }
llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false, features = ["path", "timers"] }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false }
parley = "0.11.1"
runtime = { path = "../runtime" }
skrifa = "0.44"
slotmap = "1"
taffy = { version = "0.11", default-features = false, features = [
    "std",
    "block_layout",
    "flexbox",
    "grid",
    "content_size",
    "parse",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
vello_common = { version = "0.2", default-features = false, features = ["std"] }
vello_hybrid = { version = "0.2", default-features = false, features = ["text", "wgpu"] }
wgpu = { version = "29", features = ["std", "wgsl"] }
winit = { package = "burokku-winit", path = "../winit" }